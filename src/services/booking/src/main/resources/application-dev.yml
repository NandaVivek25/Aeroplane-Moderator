spring:
  application:
    name: booking
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    clean-disabled: false
  datasource:
    url: jdbc:h2:mem:bookingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
    entity-packages-to-scan: io.bookingmicroservices

logging:
  name: booking-logger
  level:
    root: INFO
    io:
      grpc: DEBUG

server:
  port: 8084

grpc:
  server:
    port: 9094
  client:
    flight-service:
      address: "static://localhost:9092"
    passenger-service:
      address: "static://localhost:9093"