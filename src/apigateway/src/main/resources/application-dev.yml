spring:
  application:
    name: api.gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8080/realms/keycloak-realm/protocol/openid-connect/certs
  cloud:
    gateway:
      routes:
        - id: flight-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/{version}/flight/**
          filters:
            - TokenRelay
        - id: passenger-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/{version}/passenger/**
          filters:
            - TokenRelay
        - id: booking-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/{version}/booking/**
          filters:
            - TokenRelay
  datasource:
    url: jdbc:h2:mem:gatewaydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
    entity-packages-to-scan: io.bookingmicroservices

server:
  port: 8081